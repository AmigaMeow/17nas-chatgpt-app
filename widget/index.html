<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#333; background:transparent; --brand:#1a5f4a; --muted:#767676; --line:#e8e8e8; --surface:#fff; --soft:#f7f7f7; --badge:#eee; --icon:#eaf2ee; }

body { margin:0; padding:8px; }

.pill[data-state=unsupported] { color:#b93838; background:#fbeaea; }
.pill[data-state=unsupported]:before { background:#b93838; }
@media (prefers-color-scheme:dark) { .pill[data-state=unsupported] { color:#ff7b7b; background:#381d1d; } .pill[data-state=unsupported]:before { background:#ff7b7b; } }

#loading { margin-top:6px; }

progress { display:block; width:100%; height:4px; border:none; border-radius:4px; overflow:hidden; accent-color:var(--bar,var(--brand)); background:var(--soft); }
progress::-webkit-progress-bar { background:var(--soft); }
progress::-webkit-progress-value { background:var(--bar,var(--brand)); }
progress::-moz-progress-bar { background:var(--bar,var(--brand)); }
ol { padding:0; margin:0; list-style:none; display:grid; gap:7px; }

li:nth-child(2), li:nth-child(3) { --bar:#568a75; }
li:nth-child(4), li:nth-child(5) { --bar:#9db9ab; }
.position { display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--badge); font-size:10px; font-variant-numeric:tabular-nums; }
li:first-child .position { color:#fff; background:#1a5f4a; }
.rank-country { display:flex; align-items:center; gap:6px; min-width:0; }
.rank-country span { overflow-wrap:anywhere; }
.flag-fallback { display:inline-flex; align-items:center; justify-content:center; background:#eee; color:#777; font-size:9px; }
.flag { width:20px; height:15px; object-fit:contain; border-radius:2px; flex-shrink:0; }
.rate { text-align:right; color:var(--brand); font-size:12px; font-variant-numeric:tabular-nums; }
li progress { grid-column:2/4; height:3px; }
.query-summary { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:12px; font-size:11px; color:var(--muted); }
.intent-panel { margin:12px 0; }
#natPanel { display:grid; gap:12px; font-size:13px; }
footer { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
button, .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; font:inherit; font-size:12px; font-weight:600; color:var(--brand); border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:6px 10px; cursor:pointer; }
.btn-primary { width:100%; padding:10px 14px; background:var(--brand); color:var(--surface); border-color:var(--brand); }
.btn-primary:hover { filter:brightness(.92); }
button:hover { background:var(--icon); }
button:disabled { opacity:.65; cursor:wait; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
.about { flex:1; min-width:0; }
summary { cursor:pointer; font-size:12px; color:var(--muted); }
.about-content { margin-top:10px; display:grid; gap:8px; }
.meta { display:grid; gap:6px; }
.sample-details summary { margin-bottom:6px; }
nav { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; }
a { color:var(--brand); text-underline-offset:3px; }
#translation:empty, #error:empty, #loading:empty, #cached:empty { display:none; }
[hidden] { display:none !important; }
@media (max-width:440px) { .grid { grid-template-columns:1fr; gap:14px; } .card { padding:12px; } }
